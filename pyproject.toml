[project]
name = "song-wizard"
version = "0.44.1"
description = "Prepare songs for band practice: download, key and tempo detection, transposition and stem separation."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp[default]",
    "essentia>=2.1b6.dev1177",
    "audio-separator[cpu]",
    "numpy",
    # Chords (BTC's features) and the bass's notes (pYIN); audio-separator brings it too.
    "librosa",
    "soundfile",
    "platformdirs",
    # audio-separator imports it but no longer gets it through librosa.
    "audioread",
    # A song's data in WAV files (an ID3 chunk); yt-dlp brings it too.
    "mutagen",
    # The drums: ADTOF's model (downloaded apart, see drums.py) runs on it.
    "onnxruntime",
    # The drum sheet, drawn from MusicXML (LGPL-3).
    "verovio",
]

[project.scripts]
song-wizard = "song_wizard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Supported: Linux/WSL x86_64 and Apple Silicon Macs. Intel Macs are not supported
# (PyTorch stopped at 2.2.2 there, too old for audio-separator).
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests need the separation models (1.3 GB); network tests reach YouTube. Neither runs
# by default nor in CI: "uv run pytest -m slow" or "-m network" runs them.
addopts = "-m 'not slow and not network'"
markers = [
    "slow: needs the separation models (downloads 1.3 GB the first time)",
    "network: needs internet access",
]
